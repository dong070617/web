                const videoRef = useRef(null);

                const fadingOutRef = useRef(false);
                const mountedRef = useRef(true);

                const fadeTo = useCallback((target, duration = FADE_MS) => {
                    if (rafRef.current) {
                        cancelAnimationFrame(rafRef.current);
                        rafRef.current = null;
                    }
                    const video = videoRef.current;
                    if (!video || !mountedRef.current) return;

                    const startOpacity = parseFloat(video.style.opacity);
                    const currentOpacity = isNaN(startOpacity) ? 0 : startOpacity;
                    const startTime = performance.now();

                    function animate(now) {
                        if (!mountedRef.current) return;
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const newOpacity = currentOpacity + (target - currentOpacity) * progress;
                        if (videoRef.current) {
                            videoRef.current.style.opacity = newOpacity;
                        }
                        if (progress < 1) {
                            rafRef.current = requestAnimationFrame(animate);
                        } else {
                            rafRef.current = null;
                        }
                    }
                    rafRef.current = requestAnimationFrame(animate);
                }, []);

                useEffect(() => {
                    mountedRef.current = true;
                    const video = videoRef.current;
                    if (!video) return;

                    const onLoadedData = () => {
                        if (!mountedRef.current) return;
                        video.style.opacity = '0';
                        video.play().catch(() => {});
                        fadeTo(1);
                    };

                    const onTimeUpdate = () => {
                        if (!mountedRef.current) return;
                        if (!fadingOutRef.current &&
                            video.duration &&
                            video.duration - video.currentTime <= FADE_OUT_LEAD &&
                            video.duration - video.currentTime > 0) {
                            fadingOutRef.current = true;
                            fadeTo(0);
                        }
                    };

                    const onEnded = () => {
                        if (!mountedRef.current) return;
                        video.style.opacity = '0';
                        setTimeout(() => {
                            if (!mountedRef.current || !videoRef.current) return;
                            video.currentTime = 0;
                            fadingOutRef.current = false;
                            video.play().catch(() => {});
                            fadeTo(1);
                        }, 100);
                    };

                    video.addEventListener('loadeddata', onLoadedData);
                    video.addEventListener('timeupdate', onTimeUpdate);
                    video.addEventListener('ended', onEnded);

                    if (video.readyState >= 2) {
                        video.style.opacity = '0';
                        video.play().catch(() => {});
                        fadeTo(1);
                    }

                    return () => {
                        mountedRef.current = false;
                        if (rafRef.current) {
                            cancelAnimationFrame(rafRef.current);
                            rafRef.current = null;
                        }
                        video.removeEventListener('loadeddata', onLoadedData);
                        video.removeEventListener('timeupdate', onTimeUpdate);
                        video.removeEventListener('ended', onEnded);
                    };

                    style = {
                        { ...style, opacity: 0 } }

                    return () => observer.disconnect();
