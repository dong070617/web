    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        #root { min-height: 100vh; }
        .liquid-glass {
            background: rgba(255,255,255,0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .liquid-glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 1;
        }
        .liquid-glass > * { position: relative; z-index: 2; }
        .liquid-glass-strong {
            background: rgba(255,255,255,0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
            position: relative; overflow: hidden;
        }
        .liquid-glass-strong::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 1;
        }
        .liquid-glass-strong > * { position: relative; z-index: 2; }

<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>

    <script type="text/babel">
        // ========== 安全降级：即使 FramerMotion 未加载，也能渲染纯 HTML ==========
        const FramerMotion = window.FramerMotion;
        const safeMotion = FramerMotion
            ? FramerMotion.motion
            : new Proxy({}, { get: (_, tag) => tag });
        const safeAnimatePresence = FramerMotion
            ? FramerMotion.AnimatePresence
            : ({ children }) => React.createElement(React.Fragment, null, children);

        const { createRoot } = ReactDOM;
        const { useState, useEffect, useRef, useCallback } = React;

        // 屏蔽列表 key 警告
        const origError = console.error;
        console.error = (...args) => {
            const msg = args[0] || '';
            if (typeof msg === 'string' && msg.includes('unique "key" prop')) return;
            origError.apply(console, args);
        };

        // ---------- 视频淡入淡出 ----------
        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        function FadingVideo({ src, className = "", style = {} }) {
            const videoRef = useRef(null);
            const rafRef = useRef(null);
            const fadingOutRef = useRef(false);
            const mountedRef = useRef(true);

            const fadeTo = useCallback((target, duration = FADE_MS) => {
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                rafRef.current = null;
                const video = videoRef.current;
                if (!video || !mountedRef.current) return;
                const start = parseFloat(video.style.opacity);
                const from = isNaN(start) ? 0 : start;
                const begin = performance.now();
                function anim(now) {
                    if (!mountedRef.current) return;
                    const p = Math.min((now - begin) / duration, 1);
                    if (videoRef.current) videoRef.current.style.opacity = from + (target - from) * p;
                    if (p < 1) rafRef.current = requestAnimationFrame(anim);
                    else rafRef.current = null;
                }
                rafRef.current = requestAnimationFrame(anim);
            }, []);

            useEffect(() => {
                mountedRef.current = true;
                const video = videoRef.current;
                if (!video) return;
                const onLoaded = () => {
                    if (!mountedRef.current) return;
                    video.style.opacity = '0';
                    video.play().catch(() => {});
                    fadeTo(1);
                };
                const onTime = () => {
                    if (!mountedRef.current) return;
                    if (!fadingOutRef.current && video.duration &&
                        video.duration - video.currentTime <= FADE_OUT_LEAD &&
                        video.duration - video.currentTime > 0) {
                        fadingOutRef.current = true;
                        fadeTo(0);
                    }
                };
                const onEnd = () => {
                    if (!mountedRef.current) return;
                    video.style.opacity = '0';
                    setTimeout(() => {
                        if (!mountedRef.current || !videoRef.current) return;
                        video.currentTime = 0;
                        fadingOutRef.current = false;
                        video.play().catch(() => {});
                        fadeTo(1);
                    }, 100);
                };
                video.addEventListener('loadeddata', onLoaded);
                video.addEventListener('timeupdate', onTime);
                video.addEventListener('ended', onEnd);
                if (video.readyState >= 2) {
                    video.style.opacity = '0';
                    video.play().catch(() => {});
                    fadeTo(1);
                }
                return () => {
                    mountedRef.current = false;
                    if (rafRef.current) cancelAnimationFrame(rafRef.current);
                    video.removeEventListener('loadeddata', onLoaded);
                    video.removeEventListener('timeupdate', onTime);
                    video.removeEventListener('ended', onEnd);
                };
            }, [src, fadeTo]);

            return React.createElement('video', {
                ref: videoRef,
                src,
                autoPlay: true,
                muted: true,
                playsInline: true,
                preload: 'auto',
                className,
                style: { ...style, opacity: 0 }
            });
        }

        // ---------- 逐字模糊入场 ----------
        function BlurText({ text, className = "" }) {
            const [visible, setVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.1 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);

            const words = text.split(' ');

            return React.createElement('p', {
                ref,
                className,
                style: { display:'flex', flexWrap:'wrap', justifyContent:'center', rowGap:'0.1em' }
            },
                words.map((word, i) =>
                    React.createElement(safeMotion.span, {
                        key: i,
                        initial: { filter:'blur(10px)', opacity:0, y:50 },
                        animate: visible ? {
                            filter: ['blur(10px)','blur(5px)','blur(0px)'],
                            opacity: [0,0.5,1], y: [50,-5,0]
                        } : { filter:'blur(10px)', opacity:0, y:50 },
                        transition: visible ? {
                            duration:0.7, times:[0,0.5,1], ease:'easeOut', delay: i*0.1
                        } : { duration:0 },
                        style: { display:'inline-block', marginRight:'0.28em' }
                    }, word)
                )
            );
        }

        // ---------- 英雄区域 ----------

                    React.createElement('div', { className: 'flex-1 flex flex-col items-center justify-center pt-24 px-4 text-center' },

                        }),
                        React.createElement(safeMotion.p, {

                            animate: { filter:'blur(0px)', opacity:1, y:0 },
                            transition: { duration:0.6, delay:0.8 },

                        React.createElement(safeMotion.div, {
                            initial: { filter:'blur(10px)', opacity:0, y:20 },
                            animate: { filter:'blur(0px)', opacity:1, y:0 },

                                '查看我的作品',
                                React.createElement(ArrowUpRight, { className: 'h-5 w-5' })
                            ),
                            React.createElement('button', { className: 'text-white text-sm font-medium font-body flex items-center gap-1.5 bg-transparent border-none cursor-pointer' },
                                '下载简历',
                                React.createElement(PlayIcon, { className: 'h-4 w-4' })
                            )
                        ),
                        // 数据卡片
                        React.createElement(safeMotion.div, {
                            initial: { filter:'blur(10px)', opacity:0, y:20 },
                            animate: { filter:'blur(0px)', opacity:1, y:0 },
                            transition: { duration:0.6, delay:1.3 },
                            className: 'flex gap-4 mt-8 flex-wrap justify-center'
                        },
                            React.createElement('div', { className: 'liquid-glass p-5 w-[220px] rounded-[1.25rem] text-left' },
                                React.createElement(BrainIcon),
                                React.createElement('div', { className: 'font-heading text-white text-4xl mt-3' }, '50+'),
                                React.createElement('div', { className: 'text-xs text-white font-light mt-2' }, 'AI 项目交付')
                            ),
                            React.createElement('div', { className: 'liquid-glass p-5 w-[220px] rounded-[1.25rem] text-left' },
                                React.createElement(RobotIcon),
                                React.createElement('div', { className: 'font-heading text-white text-4xl mt-3' }, '5 年'),
                                React.createElement('div', { className: 'text-xs text-white font-light mt-2' }, '机器学习开发经验')
                            ),
                            React.createElement('div', { className: 'liquid-glass p-5 w-[220px] rounded-[1.25rem] text-left' },
                                React.createElement(EyeIcon),
                                React.createElement('div', { className: 'font-heading text-white text-4xl mt-3' }, '98%'),
                                React.createElement('div', { className: 'text-xs text-white font-light mt-2' }, '客户满意度')
                            )
                        )
                    ),
                    // 技术栈标签
                    React.createElement(safeMotion.div, {
                        initial: { filter:'blur(10px)', opacity:0, y:20 },
                        animate: { filter:'blur(0px)', opacity:1, y:0 },
                        transition: { duration:0.6, delay:1.4 },
                        className: 'flex flex-col items-center gap-4 pb-8 mt-auto'
                    },
                        React.createElement('div', { className: 'liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white' },

                        ),
                        React.createElement('div', { className: 'flex flex-wrap justify-center gap-8 md:gap-12 text-white font-body text-lg md:text-xl tracking-wide' },
                            React.createElement('span', null, 'LangChain'),
                            React.createElement('span', null, '·'),
                            React.createElement('span', null, 'PyTorch'),
                            React.createElement('span', null, '·'),
                            React.createElement('span', null, 'React'),
                            React.createElement('span', null, '·'),
                            React.createElement('span', null, 'Node.js'),
                            React.createElement('span', null, '·'),
                            React.createElement('span', null, 'AWS')
                        )
                    )
                )
            );
        }

        // ---------- 能力卡片区域 ----------
        function Capabilities() {
            const cards = [
                {
                    icon: React.createElement(BrainIcon),
                    title: '大模型应用开发',
                    desc: '基于 GPT-4o、Claude 3.5 等主流大模型，开发智能客服、知识库问答、代码助手等高可用应用。',

                },

                    tags: ['YOLOv8', '分割', 'OCR', '视频分析']
                },
                {

                    tags: ['LangGraph', 'AutoGPT', '工作流', 'API 集成']
                }
            ];

            return React.createElement('section', { className: 'relative min-h-screen bg-black overflow-hidden' },
                React.createElement(FadingVideo, {
                    src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4',
                    className: 'absolute inset-0 w-full h-full object-cover z-0 pointer-events-none'
                }),
                React.createElement('div', { className: 'relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen' },
                    React.createElement('div', { className: 'mb-auto' },
                        React.createElement(safeMotion.div, {
                            initial: { filter:'blur(10px)', opacity:0, y:20 },
                            whileInView: { filter:'blur(0px)', opacity:1, y:0 },
                            viewport: { once:true, amount:0.3 },
                            transition: { duration:0.6 }
                        },
                            React.createElement('p', { className: 'text-sm font-body text-white/80 mb-6' }, '// 核心能力'),
                            React.createElement('h2', { className: 'font-heading text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-2px]' },
                                '构建', React.createElement('br'), '智能未来'
                            )
                        ),
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6 mt-16' },
                            cards.map((card, i) =>
                                React.createElement(safeMotion.div, {
                                    key: card.title,
                                    initial: { filter:'blur(10px)', opacity:0, y:30 },
                                    whileInView: { filter:'blur(0px)', opacity:1, y:0 },
                                    viewport: { once:true, amount:0.2 },

                                },
                                    React.createElement('div', { className: 'flex items-start justify-between gap-4' },

        function App() {

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
